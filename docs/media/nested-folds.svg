<svg viewBox="0 0 680 210" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <style>
    .win { fill: #1e1e1e; }
    .muted { fill: #7c7c7c; font-size: 12px; }
    .txt { fill: #dcddde; font-size: 15px; }
  </style>
  <rect class="win" x="0" y="0" width="680" height="210" rx="10"/>

  <text class="muted" x="24" y="30" style="text-transform:uppercase;letter-spacing:0.05em;font-weight:600">collapsed</text>
  <g transform="translate(24,50)">
    <text class="txt" x="0" y="16">The mitochondria is the</text>
    <rect x="188" y="0" width="30" height="24" rx="12" style="fill:#2b2b2b;stroke:#3a3a3a"/>
    <text x="203" y="16" text-anchor="middle" style="fill:#dcddde;font-size:13px;font-weight:600">?</text>
    <text class="txt" x="226" y="16">of the cell.</text>
  </g>

  <path d="M 340 90 L 340 105" style="stroke:#4a4a4a;stroke-width:1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <text class="muted" x="24" y="130" style="text-transform:uppercase;letter-spacing:0.05em;font-weight:600">expanded — reveals a fold of its own</text>
  <g transform="translate(24,150)">
    <text class="txt" x="0" y="16">The mitochondria is the</text>
    <rect x="188" y="0" width="230" height="27" rx="7" style="fill:#241a33;stroke:#7c3aed"/>
    <text x="200" y="17" style="fill:#c9a6ff;font-size:14px">powerhouse (</text>
    <rect x="316" y="4" width="30" height="20" rx="10" style="fill:#2b2b2b;stroke:#3a3a3a"/>
    <text x="331" y="18" text-anchor="middle" style="fill:#dcddde;font-size:11px;font-weight:600">?</text>
    <text x="350" y="17" style="fill:#c9a6ff;font-size:14px">)</text>
    <text class="txt" x="426" y="16">of the cell.</text>
  </g>
</svg>
