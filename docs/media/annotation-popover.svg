<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <style>
    .win { fill: #1e1e1e; }
    .txt { fill: #dcddde; font-size: 16px; }
    .term { fill: #dcddde; font-size: 16px; text-decoration: underline; text-decoration-style: dotted; text-decoration-color: #7c7c7c; }
    .pop-bg { fill: #232323; stroke: #3a3a3a; }
    .pop-txt { fill: #c9c9c9; font-size: 13px; }
    .muted { fill: #7c7c7c; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  </style>
  <rect class="win" x="0" y="0" width="680" height="220" rx="10"/>

  <text class="muted" x="24" y="30">annotation — text always visible</text>
  <text x="24" y="64" class="txt">The <tspan class="term">mitochondria</tspan> is the powerhouse of the cell.</text>

  <!-- popover card -->
  <g transform="translate(60,84)">
    <path d="M 30 0 L 38 -8 L 46 0 Z" fill="#232323" stroke="#3a3a3a"/>
    <rect class="pop-bg" x="0" y="0" width="260" height="52" rx="8"/>
    <text class="pop-txt" x="14" y="22">the powerhouse of the cell —</text>
    <text class="pop-txt" x="14" y="40">generates most of a cell's ATP</text>
  </g>

  <line x1="24" y1="150" x2="656" y2="150" style="stroke:#2b2b2b"/>

  <text class="muted" x="24" y="176">same syntax, different class setting</text>
  <text x="24" y="200" style="fill:#5c5c5c;font-size:13px;font-family:monospace">[=mitochondria|the powerhouse of the cell=]</text>
</svg>
