<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <style>
    .win { fill: #1e1e1e; }
    .titlebar { fill: #161616; }
    .dot { r: 5; }
    .filename { fill: #999999; font-size: 12px; }
    .divider { stroke: #2b2b2b; stroke-width: 1; }
    .qtext { fill: #dcddde; font-size: 17px; }
    .label { fill: #7c7c7c; font-size: 17px; font-weight: 600; }
    .pill-collapsed rect { fill: #2b2b2b; stroke: #3a3a3a; stroke-width: 1; }
    .pill-collapsed text { fill: #dcddde; font-size: 14px; font-weight: 600; }
    .pill-expanded rect { fill: #241a33; stroke: #7c3aed; stroke-width: 1; }
    .pill-expanded text { fill: #c9a6ff; font-size: 15px; }
    .cursor { fill: #eaeaea; stroke: #000; stroke-width: 0.6; }

    .collapsed-group {
      animation: showCollapsed 4s ease infinite;
    }
    .expanded-group {
      animation: showExpanded 4s ease infinite;
      opacity: 0;
    }
    .pointer {
      animation: pointerMove 4s ease infinite;
      transform-origin: 95px 148px;
    }
    .click-ring {
      animation: clickPulse 4s ease infinite;
      transform-origin: 95px 148px;
    }

    @keyframes showCollapsed {
      0%, 33%   { opacity: 1; }
      40%, 88%  { opacity: 0; }
      95%, 100% { opacity: 1; }
    }
    @keyframes showExpanded {
      0%, 33%   { opacity: 0; }
      40%, 88%  { opacity: 1; }
      95%, 100% { opacity: 0; }
    }
    @keyframes pointerMove {
      0%   { transform: translate(0px, 20px); opacity: 0; }
      15%  { transform: translate(0px, 0px); opacity: 1; }
      36%  { transform: scale(0.85); opacity: 1; }
      40%  { transform: scale(1); opacity: 1; }
      85%  { transform: scale(1); opacity: 1; }
      91%  { transform: scale(0.85); opacity: 1; }
      96%  { transform: translate(0px, 0px); opacity: 1; }
      100% { transform: translate(0px, 20px); opacity: 0; }
    }
    @keyframes clickPulse {
      0%, 34%   { r: 0; opacity: 0; }
      37%       { r: 22; opacity: 0.5; }
      44%, 88%  { r: 0; opacity: 0; }
      92%       { r: 22; opacity: 0.5; }
      98%, 100% { r: 0; opacity: 0; }
    }
  </style>

  <rect class="win" x="0" y="0" width="680" height="240" rx="10"/>
  <rect class="titlebar" x="0" y="0" width="680" height="34" rx="10"/>
  <rect class="titlebar" x="0" y="18" width="680" height="16"/>
  <circle class="dot" cx="20" cy="17" fill="#ff5f56"/>
  <circle class="dot" cx="38" cy="17" fill="#ffbd2e"/>
  <circle class="dot" cx="56" cy="17" fill="#27c93f"/>
  <text class="filename" x="310" y="21">Biology.md</text>
  <line class="divider" x1="0" y1="34" x2="680" y2="34"/>

  <text class="qtext" x="32" y="90">Q: What powers the cell?</text>
  <text class="label" x="32" y="150">A:</text>

  <g class="collapsed-group" transform="translate(60,132)">
    <rect x="0" y="0" width="34" height="26" rx="13" class="pill-collapsed" style="fill:#2b2b2b;stroke:#3a3a3a;stroke-width:1"/>
    <text x="17" y="18" text-anchor="middle" style="fill:#dcddde;font-size:14px;font-weight:600">?</text>
  </g>

  <g class="expanded-group" transform="translate(60,130)">
    <rect x="0" y="0" width="160" height="28" rx="8" style="fill:#241a33;stroke:#7c3aed;stroke-width:1"/>
    <text x="80" y="19" text-anchor="middle" style="fill:#c9a6ff;font-size:15px">Mitochondria</text>
  </g>

  <circle class="click-ring" cx="95" cy="148" r="0" fill="none" stroke="#a882ff" stroke-width="2"/>
  <g class="pointer" transform="translate(95,148)">
    <path class="cursor" d="M0,0 L0,17 L4,13 L7,20 L10,18.5 L7,11.5 L12,11.5 Z"/>
  </g>

  <text x="32" y="215" style="fill:#5c5c5c;font-size:12px">click or hover to reveal — behavior is user-configurable</text>
</svg>
